[project]
name = "clause-splitter"
version = "0.5.0"
description = "条款拆分与内外规比对智能体 —— 条款级比对 + 可插拔检索 + 防幻觉 grounding"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # LLM
    "openai==2.38.0",
    "pydantic==2.13.4",
    "python-dotenv==1.2.2",
    "colorlog==6.10.1",
    "pyyaml==6.0.3",
    "json-repair==0.60.1",
    "requests==2.34.2",
    "APScheduler>=3.11,<4",
    # PingAn intranet gateway signing (only needed on the intranet path)
    "pycryptodome==3.23.0",
    # RAG engine (vendored chillrag/) — engine deps installed alongside
    "pyserini>=0.44.0",              # BM25 (Lucene) — requires JDK 21 (JAVA_HOME in .env)
    "pyjnius>=1.7.0",
    "faiss-cpu>=1.8.0",
    "jieba==0.42.1",                 # zh/en tokenizer for BM25 pretokenized mode
    "sentence-transformers>=5.7.0",
    "transformers>=4.44.0",
    "numpy==2.4.6",
    "rich==15.0.0",
    "mineru[pipeline]>=3.4.4,<4",    # local document parser (PDF / docx / pptx / images)
    "torchvision>=0.28.0",
    "lxml==6.1.1",
    # Business document handling
    "pdfplumber==0.11.9",
    "python-docx>=1.1.2",
    "openpyxl==3.1.5",
    # FastAPI service
    "fastapi==0.136.3",
    "uvicorn==0.49.0",
    "python-multipart==0.0.32",
    "loguru==0.7.3",
    "motor==3.7.1",
    "jinja2==3.1.6",                 # review-page template
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "pytest-asyncio==1.2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
