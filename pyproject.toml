[project]
name = "clause-splitter"
version = "0.3.0"
description = "条款拆分与内外规比对智能体 —— 条款级比对 + 可插拔检索 + 防幻觉 grounding"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # LLM & agent
    "openai==2.38.0",
    "pydantic==2.13.4",
    "python-dotenv==1.2.2",
    "colorlog==6.10.1",
    "pyyaml==6.0.3",
    "tenacity==9.1.4",
    "tiktoken==0.13.0",
    # PingAn intranet gateway signing (only needed on the intranet path)
    "pycryptodome==3.23.0",
    "json-repair==0.60.1",
    "requests==2.34.2",
    # HTML 复核页模板
    "jinja2==3.1.6",
    # Parsing
    "mineru[pipeline]>=3.4.4",   # local document parser (PDF / docx / pptx / xlsx / images)
    # Retrieval
    "pyserini>=0.44.0",          # BM25 (Lucene) — requires JDK 21 (JAVA_HOME in .env)
    "pyjnius>=1.7.0",            # pyserini's JVM bridge
    "faiss-cpu>=1.8.0",          # dense (FAISS) index
    "jieba==0.42.1",             # Chinese tokenizer for BM25 pretokenized mode
    "sentence-transformers>=5.7.0",  # qwen3-embedding-0.6b / bge-m3 dense embeddings
    "numpy==2.4.6",
    # Document parsing / export
    "pdfplumber==0.11.9",
    "pymupdf==1.27.2.3",
    "python-docx==1.1.2",
    "pdfminer-six==20251230",
    "openpyxl==3.1.5",
    "pandas==3.0.3",
    "lxml==6.1.1",
    # FastAPI thin shell
    "fastapi==0.136.3",
    "uvicorn==0.49.0",
    "python-multipart==0.0.32",
    # CLI / misc
    "rich==15.0.0",
]

[project.optional-dependencies]
dev = ["pytest==9.0.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
