[project]
name = "clause-splitter"
version = "0.5.0"
description = "条款拆分与内外规比对智能体 —— 条款级比对 + 可插拔检索 + 防幻觉 grounding"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # LLM
    "openai==2.38.0",
    "pydantic==2.13.4",
    "python-dotenv==1.2.2",
    "colorlog==6.10.1",
    "pyyaml==6.0.3",
    "json-repair==0.60.1",
    "requests==2.34.2",
    "APScheduler>=3.11,<4",
    # PingAn intranet gateway signing (only needed on the intranet path)
    "pycryptodome==3.23.0",
    # Retrieval is an external HTTP service (see assets/rag-service-contract.md);
    # the only local RAG-side dependency is the clause keyword tokenizer.
    "jieba==0.42.1",                 # zh/en tokenizer for term keywords
    # Business document handling (local plain-text parse fallback)
    "pdfplumber==0.11.9",
    "python-docx>=1.1.2",
    "openpyxl==3.1.5",
    # FastAPI service
    "fastapi==0.136.3",
    "uvicorn==0.49.0",
    "python-multipart==0.0.32",
    "loguru==0.7.3",
    "motor==3.7.1",
    "jinja2==3.1.6",                 # review-page template
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "pytest-asyncio==1.2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
